name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build extension package
        run: npm run package

      - name: Validate release tag
        run: |
          MANIFEST_VERSION="$(node -e 'const fs = require("node:fs"); const manifest = JSON.parse(fs.readFileSync("extension/manifest.json", "utf8")); process.stdout.write(manifest.version);')"
          if [ "${GITHUB_REF_NAME}" != "v${MANIFEST_VERSION}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match extension manifest version v${MANIFEST_VERSION}." >&2
            exit 1
          fi

      - name: Generate checksums
        run: sha256sum dist/*.zip > dist/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/SHA256SUMS \
            --title "Cursorful ${GITHUB_REF_NAME}" \
            --generate-notes
